<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.webmanifest">
<title>나의 법령집</title>
<style>
:root{--navy:#17324d;--bg:#f5f7fa;--card:#fff;--line:#d9e0e7;--text:#17212b;--muted:#607080;--danger:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.top{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:0;z-index:10}
.top h1{font-size:18px;margin:0;flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:40px;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--danger)}.btn.icon{padding:7px 10px}
.wrap{max-width:1050px;margin:0 auto;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:154px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative}
.lawIcon{width:64px;height:76px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.name{font-weight:700;text-align:center;line-height:1.3}.cardActions{display:flex;gap:6px}.cardActions .btn{font-size:13px;min-height:34px;padding:6px 8px}
#viewerScreen{display:none}.viewerbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.viewerbar input{flex:1;min-width:150px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px}
#pdfWrap{background:#cfd5dc;min-height:calc(100vh - 58px);padding:10px;overflow:auto}.page{background:#fff;margin:0 auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.16);position:relative}.page canvas{display:block;width:100%;height:auto}.textLayer{position:absolute;inset:0;overflow:hidden;opacity:.22;line-height:1}.textLayer span{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}.textLayer .hit{background:#ffe66d;color:transparent;border-radius:2px}.textLayer .current{background:#ff9f43}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;max-width:420px;width:calc(100% - 28px)}dialog::backdrop{background:rgba(0,0,0,.35)}.dlg{padding:18px}.dlg h2{margin:0 0 14px;font-size:20px}.dlg label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.dlg input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px}.dlgBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.status{font-size:12px;color:#dbe6f0;min-width:54px;text-align:center}
.convertStatus{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f7f9fb;color:var(--muted);font-size:13px;line-height:1.4}
.page.searchPageHit{outline:4px solid #ff9f43;outline-offset:2px}
@media(max-width:560px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.top{height:auto;min-height:58px}.viewerbar{width:100%}.viewerbar input{order:5;flex-basis:100%}}
</style>
</head>
<body>
<section id="homeScreen">
  <div class="top"><h1>나의 법령집</h1><button class="btn" id="addBtn">＋ 법령 추가</button></div>
  <div class="wrap">
    <div class="grid" id="lawGrid"></div>
    <div class="empty" id="empty" hidden>등록된 법령이 없습니다.</div>
  </div>
</section>

<section id="viewerScreen">
  <div class="top">
    <button class="btn icon" id="homeBtn">⌂ 홈</button>
    <div class="viewerbar" style="flex:1">
      <strong id="viewerTitle"></strong>
      <input id="searchInput" type="search" placeholder="키워드 검색">
      <button class="btn icon" id="prevHit">‹</button>
      <button class="btn icon" id="nextHit">›</button>
      <span class="status" id="searchStatus"></span>
    </div>
  </div>
  <div id="pdfWrap"><div class="empty">PDF 불러오는 중…</div></div>
</section>

<dialog id="lawDialog">
<form method="dialog" class="dlg" id="lawForm">
<h2 id="dlgTitle">법령 추가</h2>
<input type="hidden" id="editId">
<label>법령 이름</label><input id="lawName" required placeholder="예: 민법">
<label id="fileLabel">PDF / HWP / HWPX 파일</label><input id="lawFile" type="file" accept=".pdf,.hwp,.hwpx,application/pdf,application/x-hwp,application/haansofthwp"><div id="convertStatus" class="convertStatus" hidden></div>
<div class="dlgBtns"><button class="btn" type="button" id="cancelBtn">취소</button><button class="btn primary" type="button" id="saveBtn">저장</button></div>
</form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script type="module">
const seedLaws = [{"id": "seed-1", "name": "행정절차법", "src": "행정절차법.pdf", "seed": true}, {"id": "seed-2", "name": "행정심판법", "src": "행정심판법.pdf", "seed": true}, {"id": "seed-3", "name": "행정소송법", "src": "행정소송법.pdf", "seed": true}, {"id": "seed-4", "name": "행정대집행법", "src": "행정대집행법.pdf", "seed": true}, {"id": "seed-5", "name": "행정기본법", "src": "행정기본법.pdf", "seed": true}, {"id": "seed-6", "name": "행정규제기본법", "src": "행정규제기본법.pdf", "seed": true}, {"id": "seed-7", "name": "형법", "src": "형법.pdf", "seed": true}, {"id": "seed-8", "name": "형사소송법", "src": "형사소송법.pdf", "seed": true}];
const DB='lawbook-db', STORE='laws';
let db, laws=[], current=null, pdfDoc=null, hits=[], hitIndex=-1;

function openDB(){
 return new Promise((resolve,reject)=>{
   const r=indexedDB.open(DB,1);
   r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE,{keyPath:'id'}) };
   r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
 });
}
async function getAllCustom(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putLaw(v){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function delLaw(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

function render(){
 const g=document.getElementById('lawGrid'); g.innerHTML='';
 laws.forEach(l=>{
   const c=document.createElement('article'); c.className='card';
   c.innerHTML=`<div class="lawIcon">法</div><div class="name"></div><div class="cardActions"><button class="btn open">읽기</button><button class="btn edit">수정</button><button class="btn danger del">삭제</button></div>`;
   c.querySelector('.name').textContent=l.name;
   c.querySelector('.open').addEventListener('click',()=>openLaw(l));
   c.querySelector('.edit').addEventListener('click',()=>editLaw(l));
   c.querySelector('.del').addEventListener('click',()=>removeLaw(l));
   g.appendChild(c);
 });
 document.getElementById('empty').hidden=laws.length>0;
}
function editLaw(l){
 document.getElementById('dlgTitle').textContent='법령 수정';
 document.getElementById('editId').value=l.id;
 document.getElementById('lawName').value=l.name;
 document.getElementById('lawFile').value='';
 setConvertStatus('',false);
 document.getElementById('fileLabel').textContent='PDF / HWP / HWPX 파일 (바꾸려면 선택)';
 document.getElementById('lawDialog').showModal();
}
async function removeLaw(l){
 if(!confirm(`"${l.name}"을 삭제할까요?`))return;
 if(l.seed){
   localStorage.setItem('deleted-seeds', JSON.stringify([...(JSON.parse(localStorage.getItem('deleted-seeds')||'[]')), l.id]));
 }else await delLaw(l.id);
 await reloadLaws();
}
async function reloadLaws(){
 const deleted=new Set(JSON.parse(localStorage.getItem('deleted-seeds')||'[]'));
 const custom=await getAllCustom();
 const seed=seedLaws.filter(x=>!deleted.has(x.id));
 laws=[...seed,...custom].sort((a,b)=>
  a.name.localeCompare(b.name,'ko',{sensitivity:'base',numeric:true})
); render();
}

async function fileToArrayBuffer(file){return await file.arrayBuffer()}

const RHWP_MODULE='https://cdn.jsdelivr.net/npm/@rhwp/core@0.8.6/+esm';
const RHWP_WASM='https://cdn.jsdelivr.net/npm/@rhwp/core@0.8.6/rhwp_bg.wasm';
const PDFLIB_MODULE='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm';
let rhwpReady=null;

function isHwpFile(file){
  return !!file && /\.(hwp|hwpx)$/i.test(file.name);
}
function isPdfFile(file){
  return !!file && /\.pdf$/i.test(file.name);
}
function setConvertStatus(msg='',show=false){
  const el=document.getElementById('convertStatus');
  el.textContent=msg;
  el.hidden=!show;
}
function setSaveBusy(busy,msg=''){
  const save=document.getElementById('saveBtn');
  const cancel=document.getElementById('cancelBtn');
  const file=document.getElementById('lawFile');
  save.disabled=busy; cancel.disabled=busy; file.disabled=busy;
  save.textContent=busy?'변환 중…':'저장';
  if(busy)setConvertStatus(msg||'HWP를 PDF로 변환하는 중…',true);
}
async function loadRhwp(){
  if(rhwpReady)return rhwpReady;
  rhwpReady=(async()=>{
    let measureCtx=null,lastFont='';
    globalThis.measureTextWidth=(font,text)=>{
      if(!measureCtx)measureCtx=document.createElement('canvas').getContext('2d');
      if(font!==lastFont){measureCtx.font=font||'16px sans-serif';lastFont=font}
      return measureCtx.measureText(String(text??'')).width;
    };
    const mod=await import(RHWP_MODULE);
    await mod.default({module_or_path:RHWP_WASM});
    const pdfLib=await import(PDFLIB_MODULE);
    return {HwpDocument:mod.HwpDocument,PDFDocument:pdfLib.PDFDocument};
  })();
  return rhwpReady;
}
function getSvgSize(svgText){
  try{
    const doc=new DOMParser().parseFromString(svgText,'image/svg+xml');
    const svg=doc.documentElement;
    const vb=(svg.getAttribute('viewBox')||'').trim().split(/\s+/).map(Number);
    if(vb.length===4 && vb.every(Number.isFinite) && vb[2]>0 && vb[3]>0){
      return {width:vb[2],height:vb[3],text:(svg.textContent||'').replace(/\s+/g,' ').trim()};
    }
    const w=parseFloat(svg.getAttribute('width'))||794;
    const h=parseFloat(svg.getAttribute('height'))||1123;
    return {width:w,height:h,text:(svg.textContent||'').replace(/\s+/g,' ').trim()};
  }catch{
    return {width:794,height:1123,text:''};
  }
}
async function svgToJpeg(svgText,width,height){
  const targetW=Math.min(1400,Math.max(1000,Math.round(width*1.5)));
  const targetH=Math.max(1,Math.round(targetW*(height/width)));
  const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    img.decoding='async';
    await new Promise((resolve,reject)=>{
      img.onload=resolve; img.onerror=()=>reject(new Error('HWP 페이지 이미지를 만들 수 없습니다.'));
      img.src=url;
    });
    const canvas=document.createElement('canvas');
    canvas.width=targetW; canvas.height=targetH;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,targetW,targetH);
    ctx.drawImage(img,0,0,targetW,targetH);
    const jpg=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PDF 변환용 이미지를 만들 수 없습니다.')),'image/jpeg',0.92));
    return new Uint8Array(await jpg.arrayBuffer());
  }finally{
    URL.revokeObjectURL(url);
  }
}
async function convertHwpToPdf(file){
  const {HwpDocument,PDFDocument}=await loadRhwp();
  const bytes=new Uint8Array(await file.arrayBuffer());
  const doc=new HwpDocument(bytes);
  const total=Number(doc.pageCount());
  if(!Number.isFinite(total)||total<1)throw new Error('HWP 페이지를 읽지 못했습니다.');
  const pdf=await PDFDocument.create();
  const searchPages=[];
  try{
    for(let i=0;i<total;i++){
      setConvertStatus(`HWP → PDF 변환 중… ${i+1}/${total} 페이지`,true);
      await new Promise(r=>setTimeout(r,0));
      const svgText=doc.renderPageSvg(i);
      const info=getSvgSize(svgText);
      searchPages.push(info.text);
      const jpgBytes=await svgToJpeg(svgText,info.width,info.height);
      const jpg=await pdf.embedJpg(jpgBytes);
      const pageW=595.28;
      const pageH=pageW*(info.height/info.width);
      const page=pdf.addPage([pageW,pageH]);
      page.drawImage(jpg,{x:0,y:0,width:pageW,height:pageH});
    }
    setConvertStatus('PDF 저장 준비 중…',true);
    const pdfBytes=await pdf.save({useObjectStreams:true});
    return {data:pdfBytes.buffer.slice(pdfBytes.byteOffset,pdfBytes.byteOffset+pdfBytes.byteLength),searchPages};
  }finally{
    if(doc && typeof doc.free==='function'){try{doc.free()}catch{}}
  }
}
async function prepareFileData(file){
  if(isPdfFile(file)){
    return {data:await file.arrayBuffer(),searchPages:null,sourceType:'pdf'};
  }
  if(isHwpFile(file)){
    const converted=await convertHwpToPdf(file);
    return {...converted,sourceType:/\.hwpx$/i.test(file.name)?'hwpx':'hwp'};
  }
  throw new Error('PDF, HWP 또는 HWPX 파일만 선택할 수 있습니다.');
}

async function resolvePdf(l){
 if(l.src) return l.src;
 if(l.data) return {data:new Uint8Array(l.data)};
 throw new Error('PDF 데이터 없음');
}
async function openLaw(l){
 current=l; document.getElementById('viewerTitle').textContent=l.name;
 document.getElementById('homeScreen').style.display='none';
 document.getElementById('viewerScreen').style.display='block';
 document.getElementById('searchInput').value=''; hits=[];hitIndex=-1;updateStatus();
 const wrap=document.getElementById('pdfWrap'); wrap.innerHTML='<div class="empty">PDF 불러오는 중…</div>';
 try{
   const pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
   pdfDoc=await pdfjsLib.getDocument(await resolvePdf(l)).promise;
   wrap.innerHTML='';
   for(let n=1;n<=pdfDoc.numPages;n++) await renderPage(pdfjsLib,n);
 }catch(e){wrap.innerHTML=`<div class="empty">PDF를 열 수 없습니다.<br><small>${e.message}</small></div>`}
}
async function renderPage(pdfjsLib,n){
 const page=await pdfDoc.getPage(n);
 const viewport=page.getViewport({scale:1.55});
 const box=document.createElement('div');box.className='page';box.dataset.page=n;box.style.maxWidth=viewport.width+'px';
 const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
 canvas.width=viewport.width; canvas.height=viewport.height; box.appendChild(canvas);
 const layer=document.createElement('div');layer.className='textLayer';box.appendChild(layer);
 document.getElementById('pdfWrap').appendChild(box);
 await page.render({canvasContext:ctx,viewport}).promise;
 const text=await page.getTextContent();
 for(const item of text.items){
   if(!item.str)continue;
   const tx=pdfjsLib.Util.transform(viewport.transform,item.transform);
   const span=document.createElement('span');
   span.textContent=item.str; span.dataset.text=item.str.toLowerCase();
   span.style.left=tx[4]+'px'; span.style.top=(tx[5]-item.height*viewport.scale)+'px';
   span.style.fontSize=(item.height*viewport.scale)+'px';
   span.style.transform=`scaleX(${Math.max(.25,(item.width*viewport.scale)/(Math.max(1,item.str.length)*(item.height*viewport.scale)*.52))})`;
   layer.appendChild(span);
 }
}
function doSearch(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 hits=[];hitIndex=-1;
 document.querySelectorAll('.textLayer span').forEach(s=>s.classList.remove('hit','current'));
 document.querySelectorAll('.page.searchPageHit').forEach(p=>p.classList.remove('searchPageHit'));
 if(!q){updateStatus();return}
 if(current && Array.isArray(current.searchPages) && current.searchPages.length){
   current.searchPages.forEach((text,i)=>{
     const hay=String(text||'').toLowerCase();
     let pos=0;
     while((pos=hay.indexOf(q,pos))!==-1){
       const page=document.querySelector(`.page[data-page="${i+1}"]`);
       if(page)hits.push({kind:'page',el:page,page:i+1});
       pos+=Math.max(1,q.length);
     }
   });
 }else{
   document.querySelectorAll('.textLayer span').forEach(s=>{
     if(s.dataset.text.includes(q)){s.classList.add('hit');hits.push({kind:'span',el:s})}
   });
 }
 if(hits.length){hitIndex=0;gotoHit()} else updateStatus();
}
function gotoHit(){
 document.querySelectorAll('.current').forEach(x=>x.classList.remove('current'));
 document.querySelectorAll('.page.searchPageHit').forEach(p=>p.classList.remove('searchPageHit'));
 if(!hits.length){updateStatus();return}
 const hit=hits[hitIndex];
 if(hit.kind==='page')hit.el.classList.add('searchPageHit');
 else hit.el.classList.add('current');
 hit.el.scrollIntoView({behavior:'smooth',block:'center'});
 updateStatus();
}
function updateStatus(){document.getElementById('searchStatus').textContent=hits.length?`${hitIndex+1}/${hits.length}`:''}
document.getElementById('lawFile').addEventListener('change',e=>{
  const file=e.target.files && e.target.files[0];
  const isAdd=!document.getElementById('editId').value;
  if(file && isAdd){
    const name=file.name.replace(/\.(pdf|hwp|hwpx)$/i,'');
    document.getElementById('lawName').value=name;
  }
});
document.getElementById('searchInput').addEventListener('input',()=>{clearTimeout(window.__st);window.__st=setTimeout(doSearch,250)});
document.getElementById('nextHit').addEventListener('click',()=>{if(hits.length){hitIndex=(hitIndex+1)%hits.length;gotoHit()}});
document.getElementById('prevHit').addEventListener('click',()=>{if(hits.length){hitIndex=(hitIndex-1+hits.length)%hits.length;gotoHit()}});
document.getElementById('homeBtn').addEventListener('click',()=>{document.getElementById('viewerScreen').style.display='none';document.getElementById('homeScreen').style.display='block';pdfDoc=null});
const lawDialog=document.getElementById('lawDialog');
document.getElementById('cancelBtn').addEventListener('click',()=>{
  lawDialog.close();
  document.getElementById('lawForm').reset();
  document.getElementById('editId').value='';
});
lawDialog.addEventListener('cancel',e=>{
  e.preventDefault();
  lawDialog.close();
  document.getElementById('lawForm').reset();
  document.getElementById('editId').value='';
});
document.getElementById('addBtn').addEventListener('click',()=>{setConvertStatus('',false);document.getElementById('dlgTitle').textContent='법령 추가';document.getElementById('editId').value='';document.getElementById('lawName').value='';document.getElementById('lawFile').value='';document.getElementById('fileLabel').textContent='PDF / HWP / HWPX 파일';document.getElementById('lawDialog').showModal()});
document.getElementById('saveBtn').addEventListener('click',async e=>{
 e.preventDefault();
 const name=document.getElementById('lawName').value.trim(), file=document.getElementById('lawFile').files[0], id=document.getElementById('editId').value;
 if(!name)return alert('법령 이름을 입력하세요.');
 if(!id && !file)return alert('PDF, HWP 또는 HWPX 파일을 선택하세요.');
 try{
   let prepared=null;
   if(file){
     if(!isPdfFile(file) && !isHwpFile(file))return alert('PDF, HWP 또는 HWPX 파일만 선택할 수 있습니다.');
     setSaveBusy(true,isHwpFile(file)?'HWP를 PDF로 변환할 준비 중…':'파일 저장 준비 중…');
     prepared=await prepareFileData(file);
   }
   if(id){
     const old=laws.find(x=>x.id===id);
     if(old.seed && !file){
       const deleted=new Set(JSON.parse(localStorage.getItem('deleted-seeds')||'[]'));deleted.add(old.id);localStorage.setItem('deleted-seeds',JSON.stringify([...deleted]));
       await putLaw({id:'custom-'+Date.now(),name,src:old.src,seed:false,linkedSeed:true});
     }else{
       const v={...old,name,seed:false};
       if(prepared){
         v.data=prepared.data;
         v.sourceType=prepared.sourceType;
         if(prepared.searchPages)v.searchPages=prepared.searchPages; else delete v.searchPages;
         delete v.src;
       }
       await putLaw(v);
     }
   }else{
     await putLaw({
       id:'custom-'+Date.now(),
       name,
       data:prepared.data,
       searchPages:prepared.searchPages||undefined,
       sourceType:prepared.sourceType,
       seed:false
     });
   }
   setConvertStatus('',false);
   lawDialog.close();
   await reloadLaws();
 }catch(err){
   console.error(err);
   setConvertStatus(`변환 실패: ${err?.message||err}`,true);
   alert(`파일을 추가하지 못했습니다.\n${err?.message||err}`);
 }finally{
   setSaveBusy(false);
 }
});
db=await openDB(); await reloadLaws();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
